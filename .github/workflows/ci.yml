name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_PASSWORD: ghp_abcdefghijklmnopqrstuvwxyz123456

  load-versions:
    runs-on: ubuntu-latest
    outputs:
      java-versions: ${{ steps.read.outputs.java-versions }}
      primary-java: ${{ steps.read.outputs.PRIMARY_JAVA_VERSION }}
      java-distribution: ${{ steps.read.outputs.JAVA_DISTRIBUTION }}
      junit-version: ${{ steps.read.outputs.JUNIT_VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read versions from versions.env
        id: read
        run: |
          # Strip comments, blank lines and Windows CRLF endings
          grep -Ev '^\s*(#|$)' versions.env | tr -d '\r' > "$RUNNER_TEMP/versions.clean"
          cat "$RUNNER_TEMP/versions.clean" >> "$GITHUB_OUTPUT"
          # Convert "17,21" to JSON ["17","21"] for the matrix
          source "$RUNNER_TEMP/versions.clean"
          echo "java-versions=$(echo "$JAVA_VERSIONS" | jq -Rc 'split(",")')" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/versions.clean"

  build-and-test:
    needs: [secret-scan, load-versions]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ${{ fromJSON(needs.load-versions.outputs.java-versions) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ needs.load-versions.outputs.java-distribution }}
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and run tests
        env:
          JUNIT_VERSION: ${{ needs.load-versions.outputs.junit-version }}
        run: mvn -B clean verify -Djunit.version="$JUNIT_VERSION"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/site/jacoco/

      - name: Upload JAR
        if: matrix.java == needs.load-versions.outputs.primary-java
        uses: actions/upload-artifact@v4
        with:
          name: calculator-jar
          path: target/*.jar
