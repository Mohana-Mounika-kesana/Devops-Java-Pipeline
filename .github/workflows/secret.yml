on:
  push:
    branch:
    - main
    pull_request:
      branches:
      - main
jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: checkout branch
        uses: actions/checkout@v2
      - name: check for secrets
        run:  |
          grep -r "SECRET" . && exit 1 || echo "no secret found" 
    
