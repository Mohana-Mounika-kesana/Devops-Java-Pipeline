on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: checkout branch
        uses: actions/checkout@v2
      - name: check for secrets
        run:  |
          grep -r "SECRET=" .  || echo "no secret found" 
    
